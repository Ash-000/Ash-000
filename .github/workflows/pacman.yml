name: Generate Pacman & Dune Sandworm Contribution Animation

on:
  schedule:
    - cron: "0 */12 * * *" # runs every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Pacman Contribution Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          theme: github-dark

      - name: Generate Dune Sandworm Contribution Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/sandworm-dune.svg?color_snake=#e8a33d&color_dots=#2b1a0f,#5a361e,#8c531b,#c17817,#e8a33d
            dist/sandworm-dune-dark.svg?color_snake=#e8a33d&color_dots=#1e120b,#4a2c16,#8c531b,#c17817,#e8a33d
            dist/sandworm-dune.gif?color_snake=#e8a33d&color_dots=#2b1a0f,#5a361e,#8c531b,#c17817,#e8a33d&color_background=#1a1009

      - name: Prepare mirror paths for dist compatibility
        run: |
          mkdir -p dist/dist
          cp dist/*.svg dist/*.gif dist/dist/ 2>/dev/null || true

      - name: Push animations to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}